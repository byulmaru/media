name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:server
      - run: pnpm dry-run
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 4.2.2
      - run: helm lint helm/
      - run: helm template media helm/ --namespace media
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform -chdir=terraform init -backend=false
      - run: pnpm infra:fmt
      - run: pnpm infra:validate

  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag byulmaru-media:ci .

  publish:
    needs: [validate, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push image
        env:
          IMAGE_NAME: ghcr.io/byulmaru/media
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE_NAME:latest" --tag "$IMAGE_NAME:$GITHUB_SHA" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
      - name: Resolve published image digest
        id: image
        env:
          IMAGE_NAME: ghcr.io/byulmaru/media
        run: |
          set -euo pipefail
          image_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er '.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))')"
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
    steps:
      - name: Install Argo CD CLI
        uses: clowdhaus/argo-cd-action@946f488cf2607049c2e6ca86902ac50783927ec1 # v4.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 3.4.2
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions
      - name: Get Argo CD token
        id: argocd-token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.setOutput("token", dexToken);
      - name: Update and verify media Application
        env:
          ARGOCD_AUTH_TOKEN: ${{ steps.argocd-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Published workflow did not provide a full commit SHA."
            exit 1
          fi
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published image did not provide a valid SHA-256 digest."
            exit 1
          fi

          if ! timeout 300s bash -euo pipefail <<'BASH'
          for attempt in {1..30}; do
            if argocd --server "${ARGOCD_SERVER}" --grpc-web app set media \
              --revision "${GITHUB_SHA}" \
              -p "version=${GITHUB_SHA}" \
              -p "imageDigest=${IMAGE_DIGEST}" \
              --sync-policy automated \
              --auto-prune \
              --self-heal \
              --validate; then
              exit 0
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              exit 1
            fi
            echo "Waiting for Terraform to create the media Argo CD Application (attempt ${attempt}/30)."
            sleep 10
          done
          BASH
          then
            echo "::error::Argo CD Application media was not ready after 5 minutes."
            exit 1
          fi

          poll_deadline=$((SECONDS + 600))
          attempt=0
          while (( SECONDS < poll_deadline )); do
            attempt=$((attempt + 1))
            poll_timeout=$((poll_deadline - SECONDS))
            if (( poll_timeout <= 0 )); then
              break
            fi
            application_json="$(timeout "${poll_timeout}s" argocd --server "${ARGOCD_SERVER}" --grpc-web app get media -o json 2>/dev/null || true)"
            if [[ -n "${application_json}" ]] && jq -e \
              --arg sha "${GITHUB_SHA}" \
              --arg digest "${IMAGE_DIGEST}" \
              '
                . as $app
                | ($app.spec.source.targetRevision == $sha)
                  and any(($app.spec.source.helm.parameters // [])[]?; .name == "version" and .value == $sha)
                  and any(($app.spec.source.helm.parameters // [])[]?; .name == "imageDigest" and .value == $digest)
                  and ($app.status.sync.revision == $sha)
                  and ($app.status.sync.status == "Synced")
                  and ($app.status.health.status == "Healthy")
              ' <<<"${application_json}" >/dev/null 2>&1; then
              echo "Argo CD reconciled media to ${GITHUB_SHA} and ${IMAGE_DIGEST}."
              exit 0
            fi

            if (( attempt % 6 == 0 )); then
              echo "Waiting for Argo CD to reconcile media to the workflow SHA and image digest (check ${attempt})."
            fi
            remaining=$((poll_deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            if (( remaining > 10 )); then
              remaining=10
            fi
            sleep "${remaining}"
          done

          echo "::error::Argo CD did not reconcile media to the workflow SHA and image digest within 10 minutes."
          exit 1
