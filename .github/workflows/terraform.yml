name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-media-state
  cancel-in-progress: false

env:
  TF_STATE_NAMESPACE: ${{ vars.TF_STATE_NAMESPACE }}
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: byulmaru-terraform-state
  TF_STATE_KEY: media/terraform.tfstate
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  terraform:
    name: Terraform
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manual ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual Terraform apply is allowed only for refs/heads/main; got ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Authenticate to OCI Object Storage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          OCI_IDENTITY_DOMAIN_URL: ${{ vars.OCI_IDENTITY_DOMAIN_URL }}
          OCI_OIDC_CLIENT_ID: ${{ vars.OCI_OIDC_CLIENT_ID }}
          OCI_OIDC_CLIENT_SECRET: ${{ secrets.OCI_OIDC_CLIENT_SECRET }}
        with:
          script: |
            const { generateKeyPairSync } = require('node:crypto');
            const { mkdtempSync, writeFileSync } = require('node:fs');
            const { join } = require('node:path');
            const { OCI_IDENTITY_DOMAIN_URL, OCI_OIDC_CLIENT_ID, OCI_OIDC_CLIENT_SECRET, RUNNER_TEMP } = process.env;
            const domain = new URL(OCI_IDENTITY_DOMAIN_URL);
            if (domain.protocol !== 'https:' || !domain.hostname.endsWith('.identity.oraclecloud.com')) {
              throw new Error('Expected an OCI Identity Domain HTTPS URL');
            }
            const jwt = await core.getIDToken();
            core.setSecret(jwt);
            const { privateKey, publicKey } = generateKeyPairSync('rsa', { modulusLength: 2048 });
            const credentials = Buffer.from(`${OCI_OIDC_CLIENT_ID}:${OCI_OIDC_CLIENT_SECRET}`).toString('base64');
            core.setSecret(credentials);
            const response = await fetch(new URL('/oauth2/v1/token', domain), {
              method: 'POST',
              headers: { authorization: `Basic ${credentials}` },
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange',
                requested_token_type: 'urn:oci:token-type:oci-rpst',
                subject_token_type: 'jwt',
                subject_token: jwt,
                public_key: publicKey.export({ type: 'spki', format: 'der' }).toString('base64'),
                res_type: 'githubactions',
                rpst_exp: '60',
              }),
            });
            if (!response.ok) throw new Error(`OCI token exchange failed (${response.status})`);
            const { token } = await response.json();
            if (!token) throw new Error('OCI token exchange returned no RPST');
            core.setSecret(token);
            const directory = mkdtempSync(join(RUNNER_TEMP, 'oci-rpst-'));
            const privateKeyPath = join(directory, 'private.pem');
            const tokenPath = join(directory, 'rpst');
            writeFileSync(privateKeyPath, privateKey.export({ type: 'pkcs8', format: 'pem' }), { mode: 0o600 });
            writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable('OCI_RESOURCE_PRINCIPAL_VERSION', '2.2');
            core.exportVariable('OCI_RESOURCE_PRINCIPAL_RPST', tokenPath);
            core.exportVariable('OCI_RESOURCE_PRINCIPAL_PRIVATE_PEM', privateKeyPath);
            core.exportVariable('OCI_RESOURCE_PRINCIPAL_REGION', 'ap-chuncheon-1');

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="namespace=${TF_STATE_NAMESPACE}"

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Render Terraform plan
        run: |
          set -euo pipefail
          terraform -chdir=terraform show -no-color tfplan > terraform/tfplan.txt
          total_lines="$(wc -l < terraform/tfplan.txt)"

          {
            echo "## Terraform plan"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- State: \`oci://${TF_STATE_BUCKET}/${TF_STATE_KEY}\`"
            echo
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "This pull request only creates a plan. Merging to \`main\` creates and applies a fresh plan."
            else
              echo "This run applies the generated saved plan."
            fi
            echo
            echo "<details>"
            echo "<summary>terraform show -no-color tfplan</summary>"
            echo
            echo '```terraform'
            sed -n '1,600p' terraform/tfplan.txt
            if [[ "${total_lines}" -gt 600 ]]; then
              echo
              echo "... truncated; download the terraform-plan artifact for the full plan ..."
            fi
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save Terraform plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          if-no-files-found: error
          retention-days: 3

      - name: Terraform apply saved plan
        if: ${{ github.event_name != 'pull_request' }}
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Show Wrangler bindings
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "## Wrangler bindings"
            echo
            echo '```hcl'
            terraform -chdir=terraform output wrangler_bindings
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
