name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-media-state
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: byulmaru-terraform-state
  TF_STATE_KEY: media/terraform.tfstate
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          [[ -n "${AWS_ROLE_ARN}" ]] || { echo "Missing repository variable: AWS_ROLE_ARN" >&2; exit 1; }
          [[ -n "${TF_VAR_cloudflare_account_id}" ]] || { echo "Missing repository variable: CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || { echo "Missing repository secret: CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Render Terraform plan
        run: |
          set -euo pipefail
          terraform -chdir=terraform show -no-color tfplan > terraform/tfplan.txt
          total_lines="$(wc -l < terraform/tfplan.txt)"

          {
            echo "## Terraform plan"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- State: \`s3://${TF_STATE_BUCKET}/${TF_STATE_KEY}\`"
            echo
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "This pull request only creates a plan. Merging to \`main\` creates and applies a fresh plan."
            else
              echo "This run applies the generated saved plan."
            fi
            echo
            echo "<details>"
            echo "<summary>terraform show -no-color tfplan</summary>"
            echo
            echo '```terraform'
            sed -n '1,600p' terraform/tfplan.txt
            if [[ "${total_lines}" -gt 600 ]]; then
              echo
              echo "... truncated; download the terraform-plan artifact for the full plan ..."
            fi
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save Terraform plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          if-no-files-found: error
          retention-days: 3

      - name: Terraform apply saved plan
        if: ${{ github.event_name != 'pull_request' }}
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Show Wrangler bindings
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "## Wrangler bindings"
            echo
            echo '```hcl'
            terraform -chdir=terraform output wrangler_bindings
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
