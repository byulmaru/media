name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-media-state
  cancel-in-progress: false

env:
  ARGOCD_SERVER: argocd-aws.tail1fdd55.ts.net:443
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: byulmaru-terraform-state
  TF_STATE_KEY: media/terraform.tfstate
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manual ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual Terraform apply is allowed only for refs/heads/main; got ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Validate workflow configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
        run: |
          [[ -n "${AWS_ROLE_ARN}" ]] || { echo "Missing repository variable: AWS_ROLE_ARN" >&2; exit 1; }
          [[ -n "${TF_VAR_cloudflare_account_id}" ]] || { echo "Missing repository variable: CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [[ -n "${TF_VAR_cloudflare_zone_id}" ]] || { echo "Missing repository variable: CLOUDFLARE_ZONE_ID" >&2; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || { echo "Missing repository secret: CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "${TAILSCALE_OAUTH_CLIENT_ID}" ]] || { echo "Missing repository variable: TAILSCALE_OAUTH_CLIENT_ID" >&2; exit 1; }
          [[ -n "${TAILSCALE_AUDIENCE}" ]] || { echo "Missing repository variable: TAILSCALE_AUDIENCE" >&2; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:github-actions

      - name: Authenticate to Argo CD
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const githubToken = await core.getIDToken();
            core.setSecret(githubToken);

            const response = await fetch(`https://${process.env.ARGOCD_SERVER}/api/dex/token`, {
              method: "POST",
              headers: {
                authorization: `Basic ${Buffer.from("argo-cd-cli:").toString("base64")}`,
              },
              body: new URLSearchParams({
                connector_id: "github-actions",
                grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
                scope: "openid email profile federated:id",
                requested_token_type: "urn:ietf:params:oauth:token-type:access_token",
                subject_token: githubToken,
                subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              }),
            });

            if (!response.ok) {
              throw new Error(`Dex token exchange failed: ${response.status} ${await response.text()}`);
            }

            const { access_token: dexToken } = await response.json();
            if (!dexToken) {
              throw new Error("Dex token response did not include an access token.");
            }

            core.setSecret(dexToken);
            core.exportVariable("ARGOCD_AUTH_TOKEN", dexToken);

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.7"

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Render Terraform plan
        run: |
          set -euo pipefail
          terraform -chdir=terraform show -no-color tfplan > terraform/tfplan.txt
          total_lines="$(wc -l < terraform/tfplan.txt)"

          {
            echo "## Terraform plan"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- State: \`s3://${TF_STATE_BUCKET}/${TF_STATE_KEY}\`"
            echo
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "This pull request only creates a plan. Merging to \`main\` creates and applies a fresh plan."
            else
              echo "This run applies the generated saved plan."
            fi
            echo
            echo "<details>"
            echo "<summary>terraform show -no-color tfplan</summary>"
            echo
            echo '```terraform'
            sed -n '1,600p' terraform/tfplan.txt
            if [[ "${total_lines}" -gt 600 ]]; then
              echo
              echo "... truncated; download the terraform-plan artifact for the full plan ..."
            fi
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save Terraform plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          if-no-files-found: error
          retention-days: 3

      - name: Terraform apply saved plan
        if: ${{ github.event_name != 'pull_request' }}
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Show Wrangler bindings
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "## Wrangler bindings"
            echo
            echo '```hcl'
            terraform -chdir=terraform output wrangler_bindings
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
