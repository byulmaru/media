apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-sync
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-kubernetes-sync
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-kubernetes-sync
    serviceAccount: vault-secrets-sync
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: env
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  vaultAuthRef: vso-kubernetes-sync
  mount: secret
  type: kv-v2
  path: kubernetes/media
  refreshAfter: 5m
  destination:
    name: env
    create: true
    overwrite: true
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
    - kind: Deployment
      name: {{ .Release.Name }}-worker
