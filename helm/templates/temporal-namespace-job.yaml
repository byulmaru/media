apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-temporal-namespace
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/instance: {{ .Release.Name }}-temporal-namespace
    app.kubernetes.io/component: temporal-namespace
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media
        app.kubernetes.io/instance: {{ .Release.Name }}-temporal-namespace
        app.kubernetes.io/component: temporal-namespace
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-namespace
          image: {{ .Values.temporal.adminToolsImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if temporal operator namespace create \
                --address "${TEMPORAL_ADDRESS}" \
                --tls=false \
                --disable-config-env \
                --disable-config-file \
                --client-connect-timeout 10s \
                --command-timeout 20s \
                --namespace "${TEMPORAL_NAMESPACE}" \
                --retention 30d; then
                echo "Created Temporal namespace ${TEMPORAL_NAMESPACE}."
              else
                echo "Temporal namespace create did not succeed; reconciling the existing namespace."
                temporal operator namespace update \
                  --address "${TEMPORAL_ADDRESS}" \
                  --tls=false \
                  --disable-config-env \
                  --disable-config-file \
                  --client-connect-timeout 10s \
                  --command-timeout 20s \
                  --namespace "${TEMPORAL_NAMESPACE}" \
                  --retention 30d
                echo "Reconciled Temporal namespace ${TEMPORAL_NAMESPACE}."
              fi

{{- if .Values.temporal.nexusEndpoint }}
              if temporal operator nexus endpoint create \
                --address "${TEMPORAL_ADDRESS}" \
                --tls=false \
                --disable-config-env \
                --disable-config-file \
                --client-connect-timeout 10s \
                --command-timeout 20s \
                --name "${TEMPORAL_NEXUS_ENDPOINT}" \
                --target-namespace "${TEMPORAL_NAMESPACE}" \
                --target-task-queue "${TEMPORAL_TASK_QUEUE}"; then
                echo "Created Temporal Nexus endpoint ${TEMPORAL_NEXUS_ENDPOINT}."
              else
                echo "Temporal Nexus endpoint create did not succeed; reconciling the existing endpoint."
                temporal operator nexus endpoint update \
                  --address "${TEMPORAL_ADDRESS}" \
                  --tls=false \
                  --disable-config-env \
                  --disable-config-file \
                  --client-connect-timeout 10s \
                  --command-timeout 20s \
                  --name "${TEMPORAL_NEXUS_ENDPOINT}" \
                  --target-namespace "${TEMPORAL_NAMESPACE}" \
                  --target-task-queue "${TEMPORAL_TASK_QUEUE}"
                echo "Reconciled Temporal Nexus endpoint ${TEMPORAL_NEXUS_ENDPOINT}."
              fi
{{- end }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
{{- if .Values.temporal.nexusEndpoint }}
            - name: TEMPORAL_NEXUS_ENDPOINT
              value: {{ .Values.temporal.nexusEndpoint | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
{{- end }}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
